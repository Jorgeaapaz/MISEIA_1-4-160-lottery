stages:
  - test
  - build

# ── Test Stage ────────────────────────────────────────────────────────────────
test:
  stage: test
  image: node:20-alpine
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
  script:
    - npm ci
    - npm run lint
    - npm test
  variables:
    JWT_SECRET: $JWT_SECRET
    MONGODB_URI: "mongodb://localhost:27017"
    MONGODB_DB: "lottery_test"
    MAILHOG_HOST: "localhost"
    MAIL_PORT: "1027"
    NEXT_PUBLIC_API_URL: "http://localhost:3000"
  only:
    - master
    - merge_requests

# ── Build Stage ───────────────────────────────────────────────────────────────
build:
  stage: build
  image: node:20-alpine
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
  script:
    - npm ci
    - NODE_ENV=production npm run build
  artifacts:
    paths:
      - .next/
    expire_in: 1 hour
  only:
    - master
