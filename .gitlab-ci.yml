stages:
  - test
  - build
  - deploy

# ── Test Stage ────────────────────────────────────────────────────────────────
test:
  stage: test
  image: node:20-alpine
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
  script:
    - npm ci
    - npm run lint
    - npm test
  variables:
    JWT_SECRET: $JWT_SECRET
    MONGODB_URI: "mongodb://localhost:27017"
    MONGODB_DB: "lottery_test"
    MAILHOG_HOST: "localhost"
    MAIL_PORT: "1027"
    NEXT_PUBLIC_API_URL: "http://localhost:3000"
  only:
    - master
    - merge_requests

# ── Build Stage ───────────────────────────────────────────────────────────────
build:
  stage: build
  image: node:20-alpine
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
  script:
    - npm ci
    - NODE_ENV=production npm run build
  artifacts:
    paths:
      - .next/
    expire_in: 1 hour
  only:
    - master

# ── Deploy Stage ──────────────────────────────────────────────────────────────
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client git
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
    - chmod 600 ~/.ssh/deploy_key
    - ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - echo "Connecting to $VM_USER @ $VM_HOST"
    - ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -l "$VM_USER" "$VM_HOST"
      "set -e &&
      DEPLOY_DIR=\$HOME/MISEIA1-4-160-lottery &&
      ([ -d \"\$DEPLOY_DIR/.git\" ] && (cd \$DEPLOY_DIR && git pull origin master) || (git clone https://gitlab.codecrypto.academy/jorgeaapaz/MISEIA_1-4-160-lottery.git \$DEPLOY_DIR && cd \$DEPLOY_DIR)) &&
      cd \$DEPLOY_DIR &&
      printf 'MONGODB_URI=$MONGODB_URI\nMONGODB_DB=lottery_db\nJWT_SECRET=$JWT_SECRET\nSTRIPE_SECRET_KEY=$STRIPE_SECRET_KEY\nSTRIPE_WEBHOOK_SECRET=$STRIPE_WEBHOOK_SECRET\nNEXT_PUBLIC_STRIPE_PUBLIC_KEY=$NEXT_PUBLIC_STRIPE_PUBLIC_KEY\nMAILHOG_HOST=mailhog\nMAIL_PORT=1025\nNEXT_PUBLIC_API_URL=https://lottery.deviaaps.com\n' > .env &&
      docker compose -f docker-compose.prod.yml up -d --build &&
      echo Deployed-OK"
  environment:
    name: production
    url: https://lottery.deviaaps.com
  only:
    - master
